version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: clinicdb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicdb
    ports:
      - "5432:5432"
    volumes:
      - clinic_data:/var/lib/postgresql/data
    networks:
      - clinic_network

volumes:
  clinic_data:

networks:
  clinic_network:
    driver: bridge
